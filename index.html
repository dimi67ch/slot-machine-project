<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slot Machine</title>
    <link rel="stylesheet" href="styles.css?v=20260615-10">
    <script type="module" src="./js/main.js?v=20260615-10"></script>
    <link rel="icon" href="./assets/favicon.png" type="image/png">
</head>
<body>
    <div id="bg-smoke"></div>

    <!-- Guide overlay — direct body child so position:fixed works correctly -->
    <div id="guide" class="glass-modal">
        <div id="guide-viewport">
            <div id="guide-scale-frame">
                <div id="guide-sheet">
                    <section class="guide-card guide-card--payout">
                        <div class="guide-card-media guide-card-media--single">
                            <img src="./assets/medusa.png" alt="Medusa">
                        </div>
                        <div class="guide-card-copy">
                            <div><span>2x</span> = <span class="guide-payout" data-multiplier="1"></span></div>
                            <div><span>3x</span> = <span class="guide-payout" data-multiplier="6"></span></div>
                            <div><span>4x</span> = <span class="guide-payout" data-multiplier="100"></span></div>
                            <div><span>5x</span> = <span class="guide-payout" data-multiplier="250"></span></div>
                        </div>
                    </section>

                    <section class="guide-card guide-card--payout">
                        <div class="guide-card-media guide-card-media--letters">
                            <img src="./assets/J.svg" alt="J">
                            <img src="./assets/Q.svg" alt="Q">
                        </div>
                        <div class="guide-card-copy">
                            <div><span>3x</span> = <span class="guide-payout" data-multiplier="2"></span></div>
                            <div><span>4x</span> = <span class="guide-payout" data-multiplier="5"></span></div>
                            <div><span>5x</span> = <span class="guide-payout" data-multiplier="25"></span></div>
                        </div>
                    </section>

                    <section class="guide-card guide-card--payout">
                        <div class="guide-card-media guide-card-media--letters">
                            <img src="./assets/K.svg" alt="K">
                            <img src="./assets/A.svg" alt="A">
                        </div>
                        <div class="guide-card-copy">
                            <div><span>3x</span> = <span class="guide-payout" data-multiplier="1"></span></div>
                            <div><span>4x</span> = <span class="guide-payout" data-multiplier="4"></span></div>
                            <div><span>5x</span> = <span class="guide-payout" data-multiplier="20"></span></div>
                        </div>
                    </section>

                    <section class="guide-card guide-card--tall">
                        <div class="guide-card-media guide-card-media--single">
                            <img src="./assets/zeus.jpg" alt="Zeus">
                        </div>
                        <div class="guide-card-copy">
                            <div><span>2x</span> = <span class="guide-payout" data-multiplier="3"></span></div>
                            <div><span>3x</span> = <span class="guide-payout" data-multiplier="20"></span></div>
                            <div><span>4x</span> = <span class="guide-payout" data-multiplier="500"></span></div>
                            <div><span>5x</span> = <span class="guide-payout" data-multiplier="2000"></span></div>
                        </div>
                    </section>

                    <section class="guide-card guide-card--wide">
                        <div class="guide-card-copy">
                            <div><span>2x</span> = <span class="guide-payout" data-multiplier="2"></span></div>
                            <div><span>3x</span> = <span class="guide-payout" data-multiplier="15"></span></div>
                            <div><span>4x</span> = <span class="guide-payout" data-multiplier="250"></span></div>
                            <div><span>5x</span> = <span class="guide-payout" data-multiplier="1000"></span></div>
                        </div>
                        <div class="guide-card-media guide-card-media--duo">
                            <img src="./assets/aristoteles.png" alt="Aristoteles">
                            <img src="./assets/alexander.png" alt="Alexander">
                        </div>
                    </section>

                    <section class="guide-card guide-card--wide">
                        <div class="guide-card-copy">
                            <div><span>2x</span> = <span class="guide-payout" data-multiplier="2"></span></div>
                            <div><span>3x</span> = <span class="guide-payout" data-multiplier="10"></span></div>
                            <div><span>4x</span> = <span class="guide-payout" data-multiplier="150"></span></div>
                            <div><span>5x</span> = <span class="guide-payout" data-multiplier="500"></span></div>
                        </div>
                        <div class="guide-card-media guide-card-media--duo">
                            <img src="./assets/archimedes.png" alt="Archimedes">
                            <img src="./assets/achilles.png" alt="Achilles">
                        </div>
                    </section>

                    <section class="guide-card guide-card--bonus">
                        <div class="guide-bonus-symbol guide-bonus-symbol--wild">
                            <img src="./assets/eye.png" alt="Eye">
                            <div>Wild</div>
                        </div>
                    </section>

                    <section class="guide-card guide-card--bonus">
                        <div class="guide-bonus-combo">
                            <div class="guide-bonus-row">
                                <span>3x</span>
                                <img src="./assets/eye.png" alt="Eye">
                                <span>= Freegames</span>
                            </div>
                            <div class="guide-bonus-row">
                                <span>3x</span>
                                <img src="./assets/eye.png" alt="Eye">
                                <span>+</span>
                                <span>3x</span>
                                <img src="./assets/zeus.jpg" alt="Zeus">
                                <span>= Superspins</span>
                            </div>
                            <div class="guide-bonus-row">
                                <span>3x</span>
                                <img src="./assets/zeus.jpg" alt="Zeus">
                                <span>= Powerspins</span>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </div>
        <button id="close-guide" class="glass-btn glass-btn--danger">X</button>
    </div>

    <div id="header" class="glass-panel">
        <img id="logo-small" src="./assets/logo-small.svg" alt="Logo">
        <img id="logo" src="./assets/Logo.svg" alt="Logo">
        <div id="alt-head-fg" class="alt-head">FREEGAME</div>
        <div id="alt-head-ps" class="alt-head">POWERSPIN</div>
        <div id="alt-head-ss" class="alt-head">SUPERSPIN</div>
        <div id="mode-panel" class="mode-panel" aria-live="polite">
            <div id="mode-panel-title" class="mode-panel-title"></div>
            <div id="mode-panel-progress" class="mode-panel-progress"></div>
            <div id="mode-panel-detail" class="mode-panel-detail"></div>
        </div>
    </div>

    <div id="slot-machine" class="glass-panel glass-panel--reels">
        <div class="reel reel-glass" id="reel1"></div>
        <div class="reel reel-glass" id="reel2"></div>
        <div class="reel reel-glass" id="reel3"></div>
        <div class="reel reel-glass" id="reel4"></div>
        <div class="reel reel-glass" id="reel5"></div>
    </div>

    <div id="buttons" class="glass-panel">
        <button id="guide-button" class="glass-btn">GUIDE</button>
        <div class="stat-group">
            <div class="stat-label">BANK</div>
            <div id="bank" class="stat-value">1000</div>
        </div>
        <div class="stat-group">
            <div class="stat-label">WIN</div>
            <div id="win" class="stat-value">0</div>
        </div>
        <div class="stat-group">
            <div class="stat-label">BET</div>
            <div id="bet" class="stat-value">
                <select name="bet" id="select-bet" class="glass-select">
                    <option value="10">10</option>
                    <option value="20">20</option>
                    <option value="30">30</option>
                    <option value="40">40</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                    <option value="150">150</option>
                    <option value="200">200</option>
                    <option value="400">400</option>
                </select>
            </div>
        </div>
        <button id="spin-button" class="glass-btn glass-btn--primary">START</button>
    </div>
</body>
</html>
